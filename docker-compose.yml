version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Check if PostgreSQL is actually ready to accept connections
      # not just started
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s # check every 5 seconds
      timeout: 5s # fail if no response in 5 seconds
      retries: 5 # try 5 times before marking unhealthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:2.9.0
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:10.2.0
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    # Remove env_file here — grafana only needs GF_ variables
    # which you're already setting in environment above
    volumes:
      - ./config/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - grafana_data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
      # builder stage is correct for local dev
      # since you run npm run dev (nodemon/ts-node)
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
      # loads all your secrets (JWT, Stripe, etc) from .env
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/real_estate_api
      REDIS_URL: redis://redis:6379
      LOKI_HOST: http://loki:3100
      # Keep LOKI_HOST uncommented — your logger should handle
      # gracefully if Loki is not available
    depends_on:
      postgres:
        condition: service_healthy
        # Wait until PostgreSQL is READY, not just started
      redis:
        condition: service_healthy
      loki:
        condition: service_healthy
    command: ["npm", "run", "dev:docker"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/real_estate_api
      REDIS_URL: redis://redis:6379
      LOKI_HOST: http://loki:3100
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      loki:
        condition: service_healthy
    command: ["npm", "run", "worker:docker"]

volumes:
  postgres_data:
  redis_data:
  loki_data:
  grafana_data:
